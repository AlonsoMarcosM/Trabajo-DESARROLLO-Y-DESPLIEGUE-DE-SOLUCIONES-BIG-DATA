resources:
  jobs:
    telco_churn_simulation:
      name: "Telco Churn - Simulation"
      description: "Inyecta 1 hora de datos del buffer en events cada hora (interactions, labels, usage)."
      email_notifications:
        on_failure:
          - example@example.es
      schedule:
        quartz_cron_expression: "0 0 * * * ?"
        timezone_id: "UTC"
        pause_status: UNPAUSED
      tasks:
        - task_key: run_simulation
          description: "Inyeccion incremental de 1 hora de datos del buffer"
          notebook_task:
            notebook_path: ../notebooks/10_Simulation.ipynb
            source: WORKSPACE
            base_parameters:
              catalog: ${var.uc_catalog}
              schema: ${var.uc_schema}
              hours_to_inject: "1"