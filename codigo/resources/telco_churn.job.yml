resources:
  jobs:
    telco_churn_orchestration:
      name: "Telco Churn - Hito 2 Orchestration"
      description: "Job final de Hito 2: ejecuta pipeline Medallion y despues simulacion de Feature Store."
      email_notifications:
        on_failure:
          - example@example.es
        on_success:
          - example@example.es
      tasks:
        - task_key: run_telco_pipeline
          description: "Ejecucion del pipeline Medallion Telco Churn"
          pipeline_task:
            pipeline_id: ${resources.pipelines.telco_churn.id}
        - task_key: run_feature_store_registration_simulation
          description: "Ejecucion del notebook de registro/simulacion de Feature Store"
          depends_on:
            - task_key: run_telco_pipeline
          notebook_task:
            notebook_path: ../notebooks/04_Feature_Store_Registration.py
            source: WORKSPACE
            base_parameters:
              catalog: ${var.uc_catalog}
              schema: ${var.uc_schema}

    telco_churn_ml_orchestration:
      name: "Telco Churn - Hito 3 ML Orchestration"
      description: "Job de Hito 3: genera el training dataset, ejecuta la experimentacion MLflow y evalua/promueve el modelo."
      email_notifications:
        on_failure:
          - example@example.es
        on_success:
          - example@example.es
      tasks:
        - task_key: run_training_dataset_generation
          description: "Generacion del dataset de entrenamiento mediante Feature Engineering"
          notebook_task:
            notebook_path: ../notebooks/05_Training_Dataset_Generation.ipynb
            source: WORKSPACE
            base_parameters:
              catalog: ${var.uc_catalog}
              schema: ${var.uc_schema}
        - task_key: run_mlflow_experimentation
          description: "Experimentacion y entrenamiento con MLflow"
          depends_on:
            - task_key: run_training_dataset_generation
          notebook_task:
            notebook_path: ../notebooks/07_MLflow_Experimentation.ipynb
            source: WORKSPACE
            base_parameters:
              catalog: ${var.uc_catalog}
              schema: ${var.uc_schema}
        - task_key: run_production
          description: "Evaluacion champion-challenger y registro del modelo en produccion"
          depends_on:
            - task_key: run_mlflow_experimentation
          notebook_task:
            notebook_path: ../notebooks/08_Production.ipynb
            source: WORKSPACE
            base_parameters:
              catalog: ${var.uc_catalog}
              schema: ${var.uc_schema}
