resources:
  jobs:
    telco_churn_orchestration:
      name: "Telco Churn - Hito 2 Orchestration"
      description: "Job final de Hito 2: ejecuta pipeline Medallion y despues simulacion de Feature Store."
      email_notifications:
        on_failure:
          - example@example.es
        on_success:
          - example@example.es
      schedule:
        quartz_cron_expression: "0 0 3 * * ?"
        timezone_id: "UTC"
        pause_status: UNPAUSED
      tasks:
        - task_key: run_telco_pipeline
          description: "Ejecucion del pipeline Medallion Telco Churn"
          pipeline_task:
            pipeline_id: ${resources.pipelines.telco_churn.id}
        - task_key: run_feature_store_registration_simulation
          description: "Ejecucion del notebook de registro/simulacion de Feature Store"
          depends_on:
            - task_key: run_telco_pipeline
          notebook_task:
            notebook_path: ../notebooks/04_Feature_Store_Registration.py
            source: WORKSPACE
            base_parameters:
              catalog: ${var.uc_catalog}
              schema: ${var.uc_schema}
        - task_key: run_inference_and_label_enrichment
          description: "Inferencia en lote y propagacion de etiquetas reales"
          depends_on:
            - task_key: run_feature_store_registration_simulation
          notebook_task:
            notebook_path: ../notebooks/09_Inference_And_Label_Enrichment.ipynb
            source: WORKSPACE
            base_parameters:
              catalog: ${var.uc_catalog}
              schema: ${var.uc_schema}